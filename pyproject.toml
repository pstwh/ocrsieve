[project]
name = "ocrsieve"
version = "1.0.1"
description = "Sieve document pages by the extraction path they need: free text, OCR, or a strong model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pstwh", email = "pauloalvsjr@gmail.com" }]
keywords = ["pdf", "ocr", "document-classification", "handwriting", "onnx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Filters",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pymupdf>=1.24.3",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.17"]
dev = ["onnxruntime>=1.17", "pytest>=8.0", "build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/pstwh/ocrsieve"
Repository = "https://github.com/pstwh/ocrsieve"
Issues = "https://github.com/pstwh/ocrsieve/issues"

[project.scripts]
ocrsieve = "ocrsieve.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ocrsieve"]

[tool.setuptools.package-data]
ocrsieve = ["artifacts/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
